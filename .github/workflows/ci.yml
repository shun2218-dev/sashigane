name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 型検査
      - name: typecheck
        run: pnpm typecheck

      # スケールの不変条件（docs/decisions.md との一致を含む）
      - name: test
        run: pnpm test

      # 原則4: トークン層が単体で成立すること
      - name: packages/tokens の独立性
        run: pnpm check:tokens-isolation

      # docs/decisions.md の数値表が生成器と一致すること
      - name: 決定文書との一致
        run: pnpm check:docs-scales

      # docs/agent-failures.md の教訓が CLAUDE.md に届いていること
      - name: 教訓の同期
        run: pnpm check:lessons

      # 生成物がコミットされていないこと（原則1）
      - name: 生成物が混入していないこと
        run: node scripts/check-no-build-output.mjs

  # pnpm verify:coverage は観測対象4本のローカル clone を前提とするため CI では動かせない。
  # スケールを変更したら手元で実行し、docs/verification.md を更新すること。
